name: Update subscriber count

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      YT_CHANNEL: UCoDs7EzXlKTj_py9_Glq9ZQ
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read subscriber count
        run: node scripts/youtube.mjs
      - name: Commit if changed
        run: |
          git add youtube.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update subscriber count"
            git push
          fi
